name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (TDD gate)
        run: python -m pytest

      - name: App smoke (stdlib entrypoint)
        run: python -m src.main
