services:
  app:
    build: .
    image: quorum-coding-challenge:latest
    container_name: quorum-legislative-reports
    volumes:
      # Host data overrides image copy so evaluators can swap datasets
      - ./data:/app/data:ro
      # Generated CSVs land on the host for inspection
      - ./output:/app/output
      # Live source for local iteration without rebuild
      - ./src:/app/src:ro
    working_dir: /app
    command: ["python", "-m", "src.main"]

  # Quality gate: TDD suite (pytest is a dev dependency only)
  test:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - pip install -q -r requirements-dev.txt && python -m pytest
